# whisperai 設定ファイル
# 値を省略した場合は config.py のデフォルト値が使われる

[models]
# 音声認識エンジン（"parakeet" | "whisper"）
# "whisper" にすると parakeet-mlx 導入前の挙動（常に mlx-whisper を使用）に戻る
asr_engine = "parakeet"

# 音声認識モデル（mlx-whisper。asr_engine="whisper" のとき、または
# asr_engine="parakeet" で Parakeet 非対応言語・言語未指定のときに使用）
whisper = "mlx-community/whisper-large-v3-mlx"

# 音声認識モデル（parakeet-mlx。asr_engine="parakeet" のとき、
# 対応言語(欧州25言語)を明示指定した場合に使用）
parakeet = "mlx-community/parakeet-tdt-0.6b-v3"

# Parakeet が対応する言語（ISO 639-1）。日本語・中国語・韓国語は非対応のため
# 常に mlx-whisper にフォールバックする
parakeet_languages = [
    "bg", "cs", "da", "de", "el", "en", "es", "et", "fi", "fr", "hr", "hu", "it",
    "lt", "lv", "mt", "nl", "pl", "pt", "ro", "ru", "sk", "sl", "sv", "uk",
]

# 英語への翻訳モデル（言語別モデルが無い場合のフォールバック）
translation_multilingual = "Helsinki-NLP/opus-mt-mul-en"

# 英語以外への翻訳モデル
translation_nllb = "facebook/nllb-200-distilled-600M"

# 英語への翻訳で Helsinki-NLP/opus-mt-<言語>-en の言語別モデルを優先する言語
marian_source_langs = [
    "fr", "de", "es", "it", "nl", "pt", "ru", "pl", "sv", "da",
    "fi", "hu", "cs", "tr", "ar", "vi", "zh", "ja", "ko",
]

[filter]
# 除去する字幕クレジット・ノイズの正規表現パターン（大文字小文字無視）
credit_patterns = [
    "sous-titrage",
    "subtitl(e|ing|ed) by",
    "sync(ed|hronized)? (by|and corrected)",
    "translated by",
    "ripped by",
    "encoded by",
    "www\\.",
    "opensubtitles",
    "subscene",
    "addic7ed",
    "©",
    "transcript\\s+\\w",
]
